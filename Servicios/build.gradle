tasks.withType(AbstractArchiveTask) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Todos los fuentes de este proyecto estan en UTF-8 (normalizados el 2026-09-01).
// Se declara explicitamente para no depender de la codificacion por defecto de la
// maquina: en Windows es Cp1252, y con ella los literales con tildes quedan corruptos.
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenLocal()
    mavenCentral()
    google()
    maven { url 'https://esri.jfrog.io/artifactory/arcgis' }
}
//create a single Jar with all dependencies
task fatJar(type: Jar) {
	// poi-ooxml-schemas por si solo trae unas 10.000 clases, y con Jasper y
	// Firebase el paquete pasa de las 65535 entradas que admite un zip clasico.
	zip64 = true
	manifest {
        attributes 'Implementation-Title': 'Servicios Varios',
        	'Class-Path': '.', 
        	'Main-Class': 'ServiciosSer.ServicioPagosVirtualesWompi'
        	
        	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    //baseName = archivesBaseName
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
    
    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"
    exclude "com/esri/**"
    exclude "javafx/**"
    exclude "com/sun/javafx/**"
    exclude "swing/**"
    
    from('src/main/java') {

      include 'imagenes/*.png'
      include 'imagenes/*.jpg'
      include 'icons/*.png'
      include 'icons/*.jpg'
      include 'iconos/*.png'
      include 'iconos/*.jpg'

   }
    
}

